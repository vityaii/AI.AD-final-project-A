<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820"><rect width="1120" height="820" fill="#f5f7fa"/><style>text{font-family:Arial,sans-serif;font-size:15px}.heading{font-size:23px;font-weight:bold}.line{fill:none;stroke:#39748a;stroke-width:2}</style><text x="30" y="38" class="heading">Task Tracker — учебная реляционная модель</text><rect x="35" y="90" width="325" height="115" rx="10" fill="white" stroke="#39748a"/><text x="50" y="120" class="heading">users</text><text x="50" y="152">id: integer PK</text><text x="50" y="177">username: varchar UK</text><rect x="35" y="300" width="325" height="115" rx="10" fill="white" stroke="#39748a"/><text x="50" y="330" class="heading">projects</text><text x="50" y="362">id: integer PK</text><text x="50" y="387">name: text </text><rect x="390" y="300" width="325" height="190" rx="10" fill="white" stroke="#39748a"/><text x="405" y="330" class="heading">columns</text><text x="405" y="362">id: integer PK</text><text x="405" y="387">project_id: integer FK</text><text x="405" y="412">name: varchar </text><text x="405" y="437">position: integer </text><text x="405" y="462">is_done: boolean </text><rect x="760" y="90" width="325" height="340" rx="10" fill="white" stroke="#39748a"/><text x="775" y="120" class="heading">tasks</text><text x="775" y="152">id: integer PK</text><text x="775" y="177">project_id: integer FK</text><text x="775" y="202">column_id: integer FK</text><text x="775" y="227">user_id: integer FK</text><text x="775" y="252">assignee_id: integer FK</text><text x="775" y="277">task_number: integer </text><text x="775" y="302">title: varchar </text><text x="775" y="327">text: text </text><text x="775" y="352">priority: varchar </text><text x="775" y="377">due_date: date </text><text x="775" y="402">planned_duration_days: integer </text><path class="line" d="M360 340 H390"/><text x="365" y="325">1:N</text><path class="line" d="M715 385 H735 V165 H760"/><text x="570" y="555">columns → tasks: 1:N</text><path class="line" d="M360 450 H375 V620 H1100 V210 H1085"/><text x="450" y="610">projects → tasks: 1:N</text><path class="line" d="M360 135 H760"/><text x="400" y="120">Автор: 1:N (обязателен)</text><path class="line" d="M360 175 H760"/><text x="400" y="198">Исполнитель: 0..1 на задачу</text><text x="35" y="690">FK tasks(project_id, column_id) → columns(project_id, id)</text><text x="35" y="720">UNIQUE tasks(project_id, task_number); columns(project_id, id); columns(project_id, position)</text><text x="35" y="750">NULL разрешён: assignee_id, due_date, planned_duration_days. Статус определяется колонкой.</text><text x="35" y="780">Синтетические данные · срез 2026-11-12 · определения ограничений: sql/schema.sql</text></svg>